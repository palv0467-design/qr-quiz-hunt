<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Quiz Hunt</title>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2f;
  --card:#11233b;
  --line:#203957;
  --text:#f7fbff;
  --muted:#9db0c8;
  --accent:#36d399;
  --danger:#ff6678;
  --warn:#ffcf5a;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#122b49 0,#07111f 45%,#050b13 100%);
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  min-height:100vh;
}

main{
  max-width:760px;
  margin:auto;
  padding:24px 16px 50px;
}

.brand{
  font-size:13px;
  letter-spacing:.2em;
  color:#7ed9ff;
  font-weight:800;
}

.hero{
  padding:40px 0 22px;
}

.hero h1{
  font-size:clamp(36px,9vw,68px);
  line-height:.95;
  margin:12px 0;
}

.hero p{
  color:var(--muted);
  font-size:16px;
}

.panel{
  background:rgba(13,27,47,.9);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 18px 50px #0005;
}

.field{
  display:grid;
  gap:8px;
  margin:16px 0;
}

.field label{
  font-size:13px;
  color:var(--muted);
}

input,button{
  width:100%;
  min-height:48px;
  border-radius:14px;
  border:1px solid var(--line);
  font:inherit;
}

input{
  background:#081625;
  color:var(--text);
  padding:12px 14px;
  font-size:16px;
}

button{
  background:var(--accent);
  color:#03130d;
  font-weight:900;
  border:0;
  padding:12px 16px;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

button.secondary{
  background:#172a43;
  color:var(--text);
  border:1px solid var(--line);
}

button.danger{
  background:var(--danger);
  color:#24040a;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}

.progress{
  height:8px;
  background:#152a42;
  border-radius:99px;
  overflow:hidden;
}

.progress>div{
  height:100%;
  background:var(--accent);
  transition:width .3s;
}

.timer{
  font-variant-numeric:tabular-nums;
  font-size:44px;
  font-weight:900;
  letter-spacing:-.04em;
}

.timer.warn{
  color:var(--warn);
}

.timer.danger{
  color:var(--danger);
}

.kicker{
  color:var(--muted);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.14em;
}

.question{
  font-size:23px;
  line-height:1.35;
  margin:10px 0 20px;
}

.option{
  display:flex;
  gap:12px;
  align-items:center;
  text-align:left;
  background:#0b192a;
  color:var(--text);
  border:1px solid var(--line);
  margin:10px 0;
}

.option.selected{
  border-color:#7ed9ff;
  background:#122d45;
}

.option span{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  border-radius:10px;
  background:#19324e;
  flex:none;
}

.hint{
  border:1px dashed #4c7399;
  background:#0b1a2c;
  padding:18px;
  border-radius:16px;
  margin:18px 0;
  line-height:1.55;
}

.status{
  padding:12px 14px;
  border-radius:12px;
  margin:12px 0;
  background:#102943;
  color:#cde2f7;
}

.status.err{
  background:#351521;
  color:#ffd9de;
  border:1px solid #6e2937;
}

.status.ok{
  background:#0b3328;
  color:#caffed;
  border:1px solid #1d765c;
}

.footer{
  color:#7188a3;
  text-align:center;
  font-size:12px;
  margin-top:20px;
}

.admin-link{
  display:inline-block;
  color:#9ec7e8;
  text-decoration:none;
  font-size:12px;
  margin-top:12px;
}

.hidden{
  display:none!important;
}

#qr-scan-panel{
  margin:20px auto;
  max-width:520px;
  padding:20px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:16px;
  background:rgba(255,255,255,.05);
  text-align:center;
}

#qr-reader{
  width:100%;
  max-width:480px;
  margin:18px auto 0;
  overflow:hidden;
  border-radius:14px;
}

#qr-reader video{
  width:100%!important;
  height:auto!important;
  border-radius:14px;
}

#qr-reader__dashboard{
  display:none!important;
}

#qr-reader__scan_region{
  min-height:250px;
}

.scan-button{
  font-size:18px;
  padding:14px 22px;
  border-radius:12px;
}

.stop-button{
  background:#172a43;
  color:white;
  margin-top:10px;
}

.statrow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#0b192a;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
}

.stat b{
  font-size:25px;
}

.stat small{
  display:block;
  color:var(--muted);
}

.tablewrap{
  overflow:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:560px;
}

.table th,
.table td{
  padding:11px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
}

.pill{
  padding:5px 8px;
  border-radius:99px;
  background:#17304c;
  white-space:nowrap;
}

.pill.ok{
  background:#0b382b;
  color:#bff8df;
}

.pill.bad{
  background:#401923;
  color:#ffd6dc;
}

.qrgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.qr{
  background:#fff;
  border-radius:14px;
  padding:12px;
  color:#07111f;
}

.qr img{
  width:100%;
  display:block;
}

.qr a{
  display:block;
  text-align:center;
  color:#0b2940;
  font-size:12px;
  margin-top:7px;
  word-break:break-all;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:16px;
}

.tabs button{
  white-space:nowrap;
  width:auto;
  min-width:100px;
  background:#10233a;
  color:var(--text);
}

.tabs button.active{
  background:var(--accent);
  color:#03130d;
}

@media(max-width:480px){
  main{
    padding:18px 12px 40px;
  }

  .panel{
    padding:17px;
    border-radius:20px;
  }

  .statrow{
    grid-template-columns:1fr 1fr;
  }

  .statrow .stat:last-child{
    grid-column:1/-1;
  }

  .qrgrid{
    grid-template-columns:1fr;
  }

  .timer{
    font-size:38px;
  }
}
</style>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

</head>

<body>

<main id="app"></main>

<script>

const app = document.getElementById("app");

let token = sessionStorage.getItem("qqh_token") || "";

let state = null;
let timer = null;
let heartbeat = null;
let selected = null;

let qrScanner = null;
let qrScanBusy = false;
let scannerStarting = false;


/* =========================
   BASIC HELPERS
========================= */

function esc(s){
  return String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}


function api(url,opts={}){
  opts.headers = {
    ...(opts.headers || {}),
    ...(token ? {
      Authorization:"Bearer " + token
    } : {})
  };

  return fetch(url,opts).then(async r => {

    let d = {};

    try{
      d = await r.json();
    }catch{}

    if(!r.ok){
      throw Object.assign(
        new Error(d.error || "Request failed"),
        {
          data:d,
          status:r.status
        }
      );
    }

    return d;
  });
}


function qs(){
  return new URLSearchParams(location.search);
}


function shell(content){
  stopQrScanner();
  app.innerHTML = content;
}


function msg(t,c=""){
  const x = document.getElementById("msg");

  if(x){
    x.innerHTML =
      `<div class="status ${c}">${esc(t)}</div>`;
  }
}


/* =========================
   TIMER
========================= */

function normalizeDeadline(value){

  if(value === null || value === undefined){
    return null;
  }

  let n;

  if(typeof value === "number"){
    n = value;
  }else{
    n = Date.parse(value);

    if(Number.isNaN(n)){
      n = Number(value);
    }
  }

  if(!Number.isFinite(n)){
    return null;
  }

  /*
    If timestamp is in seconds,
    convert to milliseconds.
  */
  if(n < 100000000000){
    n *= 1000;
  }

  return n;
}


function format(ms){

  let s = Math.max(
    0,
    Math.ceil(ms / 1000)
  );

  return (
    String(Math.floor(s / 60)).padStart(2,"0")
    + ":" +
    String(s % 60).padStart(2,"0")
  );
}


function stopClock(){
  if(timer){
    clearInterval(timer);
    timer = null;
  }
}


function startClock(deadline){

  stopClock();

  const el = document.getElementById("timer");

  if(!el){
    return;
  }

  const normalized = normalizeDeadline(deadline);

  if(!normalized){
    el.textContent = "--:--";
    return;
  }

  function tick(){

    const left = normalized - Date.now();

    el.textContent = format(left);

    el.className =
      "timer" +
      (
        left <= 15000
          ? " danger"
          : left <= 30000
          ? " warn"
          : ""
      );

    if(left <= 0){

      stopClock();

      /*
        Ask the server for the real game state.
        The server remains authoritative.
      */
      refresh();
    }
  }

  tick();

  timer = setInterval(tick,250);
}


/* =========================
   LANDING
========================= */

function landing(){

  stopClock();
  stopQrScanner();

  shell(`

    <section class="hero">

      <div class="brand">
        DIGITAL BANKING • COLLEGE COMPETITION
      </div>

      <h1>
        QR QUIZ<br>HUNT
      </h1>

      <p>
        Find. Scan. Answer. Advance.
      </p>

    </section>


    <section class="panel">

      <div class="kicker">
        Contestant registration
      </div>

      <div class="field">

        <label for="name">
          Your name
        </label>

        <input
          id="name"
          maxlength="40"
          placeholder="Enter your name"
          autocomplete="name"
        >

      </div>

      <button id="start">
        START GAME
      </button>

      <div id="msg"></div>

      <a
        class="admin-link"
        href="/admin.html">
        Organiser / Admin
      </a>

    </section>

    <div class="footer">
      11 QR checkpoints • 10 digital banking questions
    </div>

  `);

  document.getElementById("start").onclick = startGame;
}


/* =========================
   START GAME
========================= */

async function startGame(){

  const input = document.getElementById("name");

  const name = input
    ? input.value.trim()
    : "";

  if(name.length < 2){

    msg(
      "Please enter your name.",
      "err"
    );

    return;
  }

  try{

    const d = await api(
      "/api/game/register",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({name})
      }
    );

    token = d.token;

    sessionStorage.setItem(
      "qqh_token",
      token
    );

    renderState(d.contestant);

  }catch(e){

    msg(
      e.message,
      "err"
    );
  }
}


/* =========================
   REFRESH GAME
========================= */

async function refresh(){

  try{

    const d = await api(
      "/api/game/state"
    );

    renderState(
      d.contestant,
      d.question,
      d
    );

  }catch(e){

    if(e.status === 401){

      token = "";

      sessionStorage.removeItem(
        "qqh_token"
      );

      landing();

    }else{

      msg(
        e.message,
        "err"
      );
    }
  }
}


/* =========================
   RENDER GAME
========================= */

function renderState(
  c,
  q,
  d = {game:{totalQr:10}}
){

  if(!c){
    return;
  }

  state = c;

  stopClock();
  stopQrScanner();


  /* DISQUALIFIED */

  if(c.state === "DISQUALIFIED"){

    shell(`

      <section class="hero">

        <div class="brand">
          QR QUIZ HUNT
        </div>

        <h1>
          GAME OVER
        </h1>

      </section>

      <section class="panel">

        <div class="status err">

          <b>
            You have been disqualified.
          </b>

          <br><br>

          ${esc(
            c.disqualifiedReason ||
            "Game rule violation."
          )}

        </div>

      </section>

    `);

    return;
  }


  /* FINISHED */

  if(c.state === "FINISHED"){

    shell(`

      <section class="hero">

        <div class="brand">
          QR QUIZ HUNT
        </div>

        <h1>
          YOU<br>FINISHED.
        </h1>

      </section>

      <section class="panel">

        <div class="kicker">
          10 / 10 completed
        </div>

        <p>
          Congratulations,
          <b>${esc(c.name)}</b>.
        </p>

        <div class="status ok">

          Your completion has been
          recorded by the organiser.

        </div>

      </section>

    `);

    return;
  }


  /* FINDING */

  if(c.state === "FINDING"){

    shell(`

      <section class="hero">

        <div class="brand">
          QR QUIZ HUNT
        </div>

        <div class="top">

          <div>

            <div class="kicker">
              Find next QR
            </div>

            <h1 style="font-size:44px">
              QR ${esc(c.currentQr)}
            </h1>

          </div>

          <div>

            <div
              id="timer"
              class="timer">
              02:00
            </div>

            <div
              class="kicker"
              style="text-align:right">
              find time
            </div>

          </div>

        </div>

        <div class="progress">

          <div
            style="width:${(
              ((c.currentQr - 1) / 10) * 100
            )}%">
          </div>

        </div>

      </section>


      <section class="panel">

        <div class="kicker">
          Your mission
        </div>

        <p>
          Find <b>QR ${esc(c.currentQr)}</b>
          in the college lobby,
          then scan it with your phone's camera.
        </p>

        <div class="hint">

          <b>Remember:</b>

          You must scan the QR codes in order.
          The next question is locked until
          you find the correct QR.

        </div>

        <div class="status">

          Your current checkpoint is
          <b>QR ${esc(c.currentQr)}</b>.

        </div>

      </section>

    `);

    startClock(c.findingDeadline);

    setTimeout(
      addScannerUI,
      100
    );

    return;
  }


  /* QUESTION */

  if(c.state === "QUESTION" && q){

    selected = null;

    shell(`

      <section class="hero">

        <div class="top">

          <div>

            <div class="brand">
              QR QUIZ HUNT
            </div>

            <div class="kicker">
              Question ${esc(c.currentQr)} of 10
            </div>

          </div>

          <div>

            <div
              id="timer"
              class="timer">
              00:30
            </div>

            <div
              class="kicker"
              style="text-align:right">
              answer time
            </div>

          </div>

        </div>

        <div class="progress">

          <div
            style="width:${(
              (c.currentQr / 10) * 100
            )}%">
          </div>

        </div>

      </section>


      <section class="panel">

        <div class="question">
          ${esc(q.question)}
        </div>

        <div id="options">

          ${q.options.map(
            (o,i) => `

              <button
                type="button"
                class="option"
                data-i="${i}">

                <span>
                  ${String.fromCharCode(65+i)}
                </span>

                <b>
                  ${esc(o)}
                </b>

              </button>

            `
          ).join("")}

        </div>

        <button
          id="submit"
          disabled>
          SUBMIT ANSWER
        </button>

        <div id="msg"></div>

      </section>

    `);


    document
      .querySelectorAll(".option")
      .forEach(b => {

        b.onclick = () => {

          document
            .querySelectorAll(".option")
            .forEach(x =>
              x.classList.remove("selected")
            );

          b.classList.add("selected");

          selected =
            Number(b.dataset.i);

          const submit =
            document.getElementById("submit");

          if(submit){
            submit.disabled = false;
          }
        };

      });


    document
      .getElementById("submit")
      .onclick = answer;


    startClock(
      c.questionDeadline
    );

  }
}


/* =========================
   QR SCANNER UI
========================= */

function addScannerUI(){

  if(
    !state ||
    state.state !== "FINDING"
  ){
    return;
  }


  if(
    document.getElementById(
      "qr-scan-panel"
    )
  ){
    return;
  }


  const panel =
    document.createElement("div");

  panel.id =
    "qr-scan-panel";


  panel.innerHTML = `

    <h2 style="margin:0 0 10px">
      📷 Scan QR Code
    </h2>

    <p style="margin:0 0 15px;opacity:.8">
      Scan QR ${esc(state.currentQr)}
      using your camera.
    </p>

    <button
      id="scan-qr-button"
      type="button"
      class="scan-button">

      📷 Open Camera

    </button>

    <button
      id="stop-qr-button"
      type="button"
      class="scan-button stop-button"
      style="display:none">

      ✕ Stop Camera

    </button>

    <div id="qr-reader"></div>

    <div id="scanner-message"></div>

  `;


  /*
    IMPORTANT:
    Put scanner inside the actual panel.
  */

  const mainPanel =
    document.querySelector(
      ".panel:last-of-type"
    );

  if(mainPanel){
    mainPanel.appendChild(panel);
  }else{
    app.appendChild(panel);
  }


  /*
    THIS WAS MISSING IN YOUR CODE.
  */

  document
    .getElementById("scan-qr-button")
    .onclick = startQrScanner;


  document
    .getElementById("stop-qr-button")
    .onclick = stopQrScanner;
}


/* =========================
   START CAMERA
========================= */

async function startQrScanner(){

  if(scannerStarting){
    return;
  }

  if(qrScanner){
    return;
  }

  const reader =
    document.getElementById("qr-reader");

  const startButton =
    document.getElementById(
      "scan-qr-button"
    );

  const stopButton =
    document.getElementById(
      "stop-qr-button"
    );


  if(!reader){
    return;
  }


  if(
    typeof Html5Qrcode ===
    "undefined"
  ){

    showScannerMessage(
      "QR scanner library could not load. Check your internet connection.",
      "err"
    );

    return;
  }


  scannerStarting = true;
  qrScanBusy = false;


  if(startButton){
    startButton.disabled = true;
    startButton.textContent =
      "Starting camera...";
  }


  try{

    qrScanner =
      new Html5Qrcode(
        "qr-reader"
      );


    /*
      Use the rear camera.
    */

    await qrScanner.start(

      {
        facingMode:{
          exact:"environment"
        }
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1.0,

        formatsToSupport:[
          Html5QrcodeSupportedFormats.QR_CODE
        ]

      },

      handleQrSuccess,

      function(errorMessage){
        /*
          Ignore normal frame-by-frame
          "QR not found" messages.
        */
      }

    );


    if(startButton){
      startButton.style.display =
        "none";
    }

    if(stopButton){
      stopButton.style.display =
        "block";
    }

    showScannerMessage(
      "Camera is running. Point it at the QR code.",
      "ok"
    );


  }catch(e){

    console.error(
      "Camera start error:",
      e
    );

    qrScanner = null;

    let message =
      "Camera could not start.";

    if(
      location.protocol !== "https:" &&
      location.hostname !== "localhost" &&
      location.hostname !== "127.0.0.1"
    ){

      message +=
        " This page must use HTTPS for camera access.";
    }else{

      message +=
        " Please allow camera permission and try again.";
    }

    showScannerMessage(
      message,
      "err"
    );


    if(startButton){

      startButton.disabled =
        false;

      startButton.textContent =
        "📷 Open Camera";
    }

  }finally{

    scannerStarting = false;
  }
}


/* =========================
   QR SUCCESS
========================= */

async function handleQrSuccess(decodedText){

  if(qrScanBusy){
    return;
  }

  qrScanBusy = true;


  /*
    Stop camera immediately.
  */

  await stopQrScanner();


  let qrNumber = null;


  /*
    First try URL.
  */

  try{

    const u =
      new URL(
        decodedText,
        location.origin
      );

    const value =
      u.searchParams.get("qr");

    if(value !== null){
      qrNumber =
        Number(value);
    }

  }catch(e){
    console.log(
      "URL parse failed"
    );
  }


  /*
    Fallback:
    qr=1
  */

  if(!Number.isInteger(qrNumber)){

    const match =
      String(decodedText)
        .match(
          /(?:\?|&)qr=(\d+)/
        );

    if(match){
      qrNumber =
        Number(match[1]);
    }
  }


  /*
    Also allow QR containing:
    QR1
    QR 1
    1
  */

  if(!Number.isInteger(qrNumber)){

    const simple =
      String(decodedText)
        .trim()
        .match(
          /^QR\s*[-#:]?\s*(\d+)$/i
        );

    if(simple){
      qrNumber =
        Number(simple[1]);
    }
  }


  if(!Number.isInteger(qrNumber)){

    qrScanBusy = false;

    showScannerMessage(
      "Invalid QR code. Please scan the official game QR.",
      "err"
    );

    return;
  }


  try{

    showScannerMessage(
      "QR detected. Checking...",
      "ok"
    );


    const d = await api(
      "/api/game/scan",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          qr:qrNumber
        })
      }
    );


    if(d.contestant){
      state =
        d.contestant;
    }


    await refresh();


  }catch(e){

    qrScanBusy = false;

    showScannerMessage(
      e.message ||
      "QR scan failed.",
      "err"
    );

  }
}


/* =========================
   STOP CAMERA
========================= */

async function stopQrScanner(){

  if(qrScanner){

    const scanner =
      qrScanner;

    qrScanner = null;

    try{

      if(
        scanner.getState &&
        scanner.getState() !== 1
      ){
        /*
          Html5Qrcode states vary by version.
          Try stop regardless below.
        */
      }

      await scanner.stop();

    }catch(e){

      console.log(
        "Scanner stop:",
        e
      );

    }

    try{
      await scanner.clear();
    }catch(e){}

  }


  qrScanBusy = false;
  scannerStarting = false;


  const startButton =
    document.getElementById(
      "scan-qr-button"
    );

  const stopButton =
    document.getElementById(
      "stop-qr-button"
    );


  if(startButton){

    startButton.style.display =
      "block";

    startButton.disabled =
      false;

    startButton.textContent =
      "📷 Open Camera";
  }


  if(stopButton){
    stopButton.style.display =
      "none";
  }
}


/* =========================
   SCANNER MESSAGE
========================= */

function showScannerMessage(
  text,
  type=""
){

  const box =
    document.getElementById(
      "scanner-message"
    );

  if(!box){
    return;
  }

  box.innerHTML =
    `<div class="status ${type}">
      ${esc(text)}
    </div>`;
}


/* =========================
   ANSWER
========================= */

async function answer(){

  if(selected === null){
    return;
  }

  try{

    const d = await api(
      "/api/game/answer",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          choice:selected
        })
      }
    );


    if(d.finished){

      renderState(
        d.contestant
      );

      return;
    }


    shell(`

      <section class="hero">

        <div class="brand">
          CORRECT ANSWER
        </div>

        <h1 style="font-size:48px">
          QR ${esc(d.nextQr - 1)}
          <br>
          COMPLETE.
        </h1>

      </section>


      <section class="panel">

        <div class="status ok">

          <b>✓ Correct.</b>

          The next checkpoint
          is unlocked.

        </div>

        <div class="hint">

          <div class="kicker">
            Hint for QR ${esc(d.nextQr)}
          </div>

          <p>
            ${esc(d.hint)}
          </p>

        </div>

        <button id="continue">
          START FINDING QR ${esc(d.nextQr)}
        </button>

      </section>

    `);


    document
      .getElementById("continue")
      .onclick = () => {

        renderState(
          d.contestant
        );

      };


  }catch(e){

    if(
      e.status === 409 ||
      e.status === 410
    ){

      refresh();

    }else{

      msg(
        e.message,
        "err"
      );
    }
  }
}


/* =========================
   VISIBILITY / ANTI-CHEAT
========================= */

document.addEventListener(
  "visibilitychange",
  async () => {

    if(
      document.hidden &&
      token &&
      state &&
      [
        "FINDING",
        "QUESTION"
      ].includes(state.state)
    ){

      try{

        const d = await api(
          "/api/game/visibility",
          {
            method:"POST"
          }
        );


        if(d.disqualified){

          refresh();

        }else if(d.warning){

          alert(
            "Warning: leaving the game page has been recorded. A second event will disqualify you."
          );

        }

      }catch{}
    }
  }
);


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
  "load",
  () => {

    const p = qs();

    if(p.has("start")){

      landing();

    }else if(token){

      refresh();

    }else{

      landing();

    }


    /*
      Heartbeat.
    */

    heartbeat =
      setInterval(
        () => {

          if(token){

            api(
              "/api/game/heartbeat",
              {
                method:"POST"
              }
            ).catch(() => {});

          }

        },
        10000
      );

  }
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopClock();
    stopQrScanner();

    if(heartbeat){
      clearInterval(heartbeat);
    }

  }
);

</script>

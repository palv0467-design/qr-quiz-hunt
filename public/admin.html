<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Quiz Hunt — Admin</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2f;--card:#11233b;--line:#203957;--text:#f7fbff;--muted:#9db0c8;--accent:#36d399;--danger:#ff6678}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#122b49,#07111f 48%,#050b13);font-family:Inter,system-ui,sans-serif;color:var(--text)}main{max-width:1200px;margin:auto;padding:24px 16px 50px}.brand{font-size:13px;letter-spacing:.2em;color:#7ed9ff;font-weight:800}h1{font-size:40px;margin:10px 0 24px}.panel{background:rgba(13,27,47,.92);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0b192a;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:28px}.stat small{display:block;color:var(--muted)}input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid var(--line);min-height:44px}input,select,textarea{width:100%;background:#081625;color:var(--text);padding:10px 12px}textarea{min-height:80px}button{padding:9px 14px;background:var(--accent);border:0;color:#03130d;font-weight:900;cursor:pointer}button.secondary{background:#172a43;color:var(--text);border:1px solid var(--line)}button.danger{background:var(--danger);color:#25050b}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{background:#10233a;color:var(--text);white-space:nowrap}.tabs button.active{background:var(--accent);color:#03130d}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.pill{padding:5px 8px;border-radius:99px;background:#17304c}.ok{background:#0b382b;color:#bff8df}.bad{background:#401923;color:#ffd6dc}.qrgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.qr{background:#fff;color:#07111f;border-radius:14px;padding:10px}.qr img{width:100%;display:block}.qr small{display:block;margin:6px 0;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border-radius:12px;background:#102943;color:#cde2f7;margin:10px 0}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.qrgrid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.qrgrid{grid-template-columns:1fr}main{padding:16px 10px}.panel{padding:15px}}
</style></head>
<body><main id="app"></main>
<script>
const app=document.getElementById("app");let token=sessionStorage.getItem("admin_token")||"",tab="dashboard",refreshTimer;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function api(url,opts={}){opts.headers={...(opts.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};return fetch(url,opts).then(async r=>{let d={};try{d=await r.json()}catch{};if(!r.ok)throw new Error(d.error||"Request failed");return d})}
function login(){app.innerHTML=`<div class="panel" style="max-width:460px;margin:70px auto"><div class="brand">ORGANISER PANEL</div><h1>Admin Login</h1><input id="u" placeholder="Username"><br><br><input id="p" type="password" placeholder="Password"><br><br><button id="go" style="width:100%">LOGIN</button><div id="msg"></div></div>`;document.getElementById("go").onclick=async()=>{try{const d=await fetch("/api/auth/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})}).then(r=>r.json());if(!d.token)throw new Error(d.error||"Login failed");token=d.token;sessionStorage.setItem("admin_token",token);draw()}catch(e){msg(e.message)}}}
function msg(t){const x=document.getElementById("msg");if(x)x.innerHTML=`<div class="notice">${esc(t)}</div>`}
async function draw(){if(!token)return login();let data;try{data=await api("/api/admin/overview")}catch(e){token="";sessionStorage.removeItem("admin_token");return login()}
app.innerHTML=`<div class="brand">DIGITAL BANKING • QR QUIZ HUNT</div><h1>Organiser Dashboard</h1><div class="actions"><button data-tab="dashboard">Dashboard</button><button class="secondary" data-tab="questions">Questions & Hints</button><button class="secondary" data-tab="qrs">QR Codes</button><button class="secondary" data-tab="settings">Settings</button><button class="danger" id="logout">Logout</button></div><div id="content"></div>`;
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});document.getElementById("logout").onclick=()=>{token="";sessionStorage.removeItem("admin_token");login()};const c=document.getElementById("content");
if(tab==="dashboard") dashboard(c,data); if(tab==="questions") questions(c); if(tab==="qrs") qrs(c); if(tab==="settings") settings(c,data.game);
}
function dashboard(c,d){c.innerHTML=`<section class="panel"><div class="grid"><div class="stat"><b>${d.counts.total}</b><small>Total</small></div><div class="stat"><b>${d.counts.active}</b><small>Active</small></div><div class="stat"><b>${d.counts.finished}</b><small>Finished</small></div><div class="stat"><b>${d.counts.disqualified}</b><small>Disqualified</small></div></div></section><section class="panel"><div class="actions"><button id="toggle">${d.game.enabled===false?"Open Game":"Game Active"}</button><button class="danger" id="reset">RESET ALL CONTESTANTS</button></div><div class="notice">Contestants refresh automatically every 3 seconds. Server-side timers are authoritative.</div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Checkpoint</th><th>State</th><th>Timer deadline</th><th>Visibility</th><th>Action</th></tr></thead><tbody>${d.contestants.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.currentQr}/10</td><td><span class="pill ${x.state==="FINISHED"?"ok":x.state==="DISQUALIFIED"?"bad":""}">${x.state}</span></td><td>${x.state==="FINDING"||x.state==="QUESTION"?new Date(x.state==="FINDING"?x.findingDeadline:x.questionDeadline).toLocaleTimeString():"—"}</td><td>${x.visibilityViolations}</td><td>${["FINDING","QUESTION"].includes(x.state)?`<button class="danger" data-disq="${x.id}">Disqualify</button>`:"—"}</td></tr>`).join("")}</tbody></table></div></section>`;document.querySelectorAll("[data-disq]").forEach(b=>b.onclick=async()=>{if(confirm("Disqualify this contestant?")){await api("/api/admin/disqualify/"+b.dataset.disq,{method:"POST"});draw()}});document.getElementById("reset").onclick=async()=>{if(confirm("Delete all current contestant sessions?")){await api("/api/admin/reset",{method:"POST"});draw()}};document.getElementById("toggle").onclick=async()=>{await api("/api/admin/game/toggle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:d.game.enabled===false})});draw()};clearTimeout(refreshTimer);refreshTimer=setTimeout(draw,3000)}
async function questions(c){const qs=await api("/api/admin/questions");c.innerHTML=`<section class="panel"><h2>Questions & Hints</h2><div id="list"></div></section>`;const list=document.getElementById("list");qs.forEach(q=>{const box=document.createElement("div");box.className="panel";box.innerHTML=`<b>QR ${q.number}</b><div class="field"><label>Question</label><textarea id="q${q.number}">${esc(q.question)}</textarea></div><div class="row">${q.options.map((o,i)=>`<div><label>Option ${String.fromCharCode(65+i)}</label><input id="o${q.number}_${i}" value="${esc(o)}"></div>`).join("")}</div><div class="row"><div><label>Correct option</label><select id="a${q.number}">${q.options.map((o,i)=>`<option value="${i}" ${q.answer===i?"selected":""}>${String.fromCharCode(65+i)} — ${esc(o)}</option>`).join("")}</select></div><div><label>Next QR hint</label><input id="h${q.number}" value="${esc(q.hint)}"></div></div><br><button data-save="${q.number}">SAVE QR ${q.number}</button>`;list.appendChild(box)});document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const n=b.dataset.save;await api("/api/admin/questions/"+n,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:document.getElementById("q"+n).value,options:[0,1,2,3].map(i=>document.getElementById("o"+n+"_"+i).value),answer:Number(document.getElementById("a"+n).value),hint:document.getElementById("h"+n).value})});b.textContent="SAVED ✓";setTimeout(()=>b.textContent="SAVE QR "+n,1000)})}
async function qrs(c){const links=await api("/api/admin/qr-links");c.innerHTML=`<section class="panel"><h2>Print / Place QR Codes</h2><div class="notice"><b>Start QR</b> stays at the main organiser table. Hidden QR 1–10 are placed around the lobby. Each QR points to a unique checkpoint URL.</div><div class="qrgrid"><div class="qr"><img src="/api/admin/start-qr.png?token=${encodeURIComponent(token)}"><small>START QR</small><a href="${links.start}" target="_blank">${esc(links.start)}</a></div>${links.qr.map(x=>`<div class="qr"><img src="/api/admin/qr/${x.number}.png?token=${encodeURIComponent(token)}"><small>QR ${x.number}</small><a href="${x.url}" target="_blank">${esc(x.url)}</a></div>`).join("")}</div></section>`}
async function settings(c,game){c.innerHTML=`<section class="panel"><h2>Game Settings</h2><div class="row"><div><label>Game title</label><input id="title" value="${esc(game.title)}"></div><div><label>QR finding time (seconds)</label><input id="find" type="number" min="5" max="900" value="${game.findingSeconds}"></div></div><br><div><label>Question answer time (seconds)</label><input id="ans" type="number" min="5" max="300" value="${game.questionSeconds}"></div><br><button id="save">SAVE SETTINGS</button><div class="notice">Recommended competition settings: 120 seconds to find a QR and 30 seconds to answer.</div></section>`;document.getElementById("save").onclick=async()=>{await api("/api/admin/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title.value,findingSeconds:Number(find.value),questionSeconds:Number(ans.value)})});alert("Settings saved.")}}
draw();
</script></body></html>
